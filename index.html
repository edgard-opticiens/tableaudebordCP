<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord — Demandes de congés</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#C9A84C;--dk:#1A1A1A;--md:#666;--lt:#F9F7F2;--bd:#E0DCD0;--green:#27AE60;--orange:#E67E22;--red:#C0392B;--blue:#2980B9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F2EFE8;min-height:100vh;padding:20px 14px 50px;color:var(--dk)}
.hdr{max-width:1100px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hdr h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--dk)}
.hdr .sub{font-size:12px;color:var(--md);margin-top:2px}
.refresh{background:var(--dk);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.refresh:hover{background:#333}
.filters{max-width:1100px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap}
.filters select,.filters input{border:1.5px solid var(--bd);border-radius:6px;padding:7px 12px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff}
.stats{max-width:1100px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border-radius:8px;padding:12px 16px;border-left:4px solid var(--g)}
.stat .n{font-family:'Playfair Display',serif;font-size:26px;font-weight:700}
.stat .l{font-size:10.5px;color:var(--md);text-transform:uppercase;letter-spacing:.5px}
table{max-width:1100px;margin:0 auto;width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.07)}
th{background:var(--dk);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:11px 12px;text-align:left}
td{padding:11px 12px;font-size:12.5px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--lt)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700}
.b-attente{background:#FFF3CD;color:#856404}
.b-valide{background:#E8F4E8;color:var(--green)}
.b-refuse{background:#FDEDEC;color:var(--red)}
.retard{color:var(--red);font-weight:700}
.empty{max-width:1100px;margin:40px auto;text-align:center;color:var(--md);font-size:13px}
.view-tabs{max-width:1100px;margin:0 auto 16px;display:flex;gap:8px}
.view-tab{background:#fff;border:1.5px solid var(--bd);color:var(--md);padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.view-tab.active{background:var(--dk);color:#fff;border-color:var(--dk)}
.btn-sign{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:5px 11px;border-radius:5px;white-space:nowrap}
.btn-sign:hover{background:#1e8449}
.btn-view{display:inline-block;background:#fff;color:var(--blue);border:1.3px solid var(--blue);text-decoration:none;font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;white-space:nowrap}
.btn-view:hover{background:#EAF2F8}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Suivi des demandes de congés</h1>
    <div class="sub" id="lastUpdate">Chargement...</div>
  </div>
  <div><button class="refresh" onclick="rafraichir()">↻ Actualiser</button> <button class="refresh" id="dirLogout" onclick="dirLogout()" style="display:none;background:#fff;color:#1A1A1A;border:1px solid #E0DCD0">Changer de magasin</button></div>
</div>

<div id="gate" style="display:none;position:fixed;inset:0;background:#F2EFE8;z-index:50;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-width:360px;width:100%;padding:30px 26px;text-align:center">
    <div style="font-family:'Playfair Display',serif;font-size:19px;margin-bottom:4px" id="gateTitle">Espace directeur</div>
    <div style="font-size:12.5px;color:#666;margin-bottom:18px" id="gateSub">Sélectionnez votre magasin et saisissez votre code directeur</div>
    <select id="gateSoc" style="width:100%;padding:10px;border:1.5px solid #E0DCD0;border-radius:6px;margin-bottom:10px;font-size:13px"><option value="">— Choisir un magasin —</option></select>
    <input type="password" id="gatePin" placeholder="Code" autocomplete="off" style="width:100%;padding:10px;border:1.5px solid #E0DCD0;border-radius:6px;text-align:center;letter-spacing:.15em;font-size:15px;margin-bottom:10px" maxlength="24">
    <button onclick="tryGate()" id="gateBtn" style="width:100%;padding:11px;background:#1A1A1A;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer">Accéder</button>
    <div id="gateErr" style="color:#C0392B;font-size:12px;margin-top:10px;min-height:16px"></div>
  </div>
</div>

<div id="app" style="display:block">

<div class="view-tabs">
  <button class="view-tab active" id="tabActives" onclick="switchView('actives')">📋 Demandes actives</button>
  <button class="view-tab" id="tabHisto" onclick="switchView('histo')">🗂 Historique complet</button>
</div>

<div class="stats" id="stats"></div>

<div class="filters">
  <select id="fSoc" onchange="render()"><option value="">Toutes sociétés</option></select>
  <select id="fStatut" onchange="render()">
    <option value="">Tous statuts</option>
    <option value="en_attente">En attente signature</option>
    <option value="valide">Validé</option>
    <option value="refuse">Refusé</option>
  </select>
  <input type="text" id="fSearch" placeholder="Rechercher un nom..." oninput="render()">
</div>

<table>
  <thead>
    <tr>
      <th>Collaborateur</th><th>Société</th><th>Type</th><th>Dates</th>
      <th>Étape</th><th>En attente de</th><th>Statut</th><th>Dernière action</th><th>Action</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="empty" id="empty" style="display:none">Aucune demande trouvée.</div>

</div>

<script>
/* ============================ CONNEXION SECURISEE =====================================
   Le code (directeur ou RH) est verifie par le serveur (n8n) ; la page ne garde qu'un jeton
   de session. Plus aucun code en clair dans cette page (contrairement a l'ancienne version).
   Session directeur partagee avec les autres outils directeur migres (meme navigateur, meme
   site edgard-opticiens.github.io) ; session RH partagee avec le dashboard RH. ========== */
var N8N_AUTH_LOGIN = 'https://edgard-opticiens.app.n8n.cloud/webhook/auth-login';
var N8N_AUTH_READ  = 'https://edgard-opticiens.app.n8n.cloud/webhook/secure-read';

var MODE_DIRECTEUR = new URLSearchParams(location.search).get('directeur') === '1';
var LOCKED_SOCIETE = null; // magasin normalise du directeur connecte (vide = vue RH, toutes societes)

var MAGASINS = ['ANGO','BIARRO','BORDO','CAENPO','CHATO','CHEMILLO','CHOLO','DUNES','ECUME','FORMIO','GIRO','HAVRO','JISAM','LYONO','MANSO','MARAIS','MARSEILLO','MUDO','NANCEO','NANTO','NICEO','NIORTO','ORLO','REIMO','STRABO','TURO'];

var DIR_KEY = 'edgard_auth_v2'; // meme cle que les portails Edgard/GdO (Espace directeur) et le dashboard RH
var RH_KEY  = 'edgard_auth_v2';              // meme cle que le dashboard RH

function normSoc(s){ return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z]/g,'').toUpperCase(); }

function sessionGet(key, wantRole){
  try{
    var o = JSON.parse(localStorage.getItem(key) || 'null');
    if(!o || !o.token) return null;
    if(wantRole && o.role !== wantRole) return null;
    if(Number(o.expire) <= Date.now()){ localStorage.removeItem(key); return null; }
    return o;
  }catch(e){ return null; }
}
function sessionSave(key, o){ try{ localStorage.setItem(key, JSON.stringify(o)); }catch(e){} }
function sessionClear(key){ try{ localStorage.removeItem(key); }catch(e){} }

function authPost(url, body){
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {ok:false}; }).then(function(j){ j.httpStatus = r.status; return j; }); });
}
function authRead(session, source, params){
  return authPost(N8N_AUTH_READ, {token: session.token, source: source, params: params || {}}).then(function(j){
    if(j && j.ok) return j.resultat || {};
    if(j && (j.error === 'session' || j.httpStatus === 401)) throw new Error('session');
    throw new Error((j && j.error) || 'lecture');
  });
}

function currentKey(){ return MODE_DIRECTEUR ? DIR_KEY : RH_KEY; }

function dirLogout(){
  sessionClear(currentKey());
  location.reload();
}

function initGate(){
  var existing = sessionGet(currentKey(), MODE_DIRECTEUR ? 'DIR' : 'RH');
  if(existing){ entrer(existing); return; }
  var socSel = document.getElementById('gateSoc');
  if(MODE_DIRECTEUR){
    document.getElementById('gateTitle').textContent = 'Espace directeur';
    document.getElementById('gateSub').textContent = 'Sélectionnez votre magasin et saisissez votre code directeur';
    socSel.style.display = '';
    MAGASINS.forEach(function(m){
      var o = document.createElement('option'); o.value = m; o.textContent = m; socSel.appendChild(o);
    });
  } else {
    document.getElementById('gateTitle').textContent = 'Espace RH';
    document.getElementById('gateSub').textContent = 'Saisissez votre code RH';
    socSel.style.display = 'none';
  }
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function tryGate(){
  var soc = MODE_DIRECTEUR ? document.getElementById('gateSoc').value : '';
  var code = document.getElementById('gatePin').value.trim();
  var err = document.getElementById('gateErr'), btn = document.getElementById('gateBtn');
  err.style.color = '#C0392B';
  if(MODE_DIRECTEUR && !soc){ err.textContent = 'Choisissez votre magasin.'; return; }
  if(!code){ err.textContent = 'Saisissez votre code.'; return; }
  btn.disabled = true; err.style.color = '#666'; err.textContent = 'Connexion en cours…';
  authPost(N8N_AUTH_LOGIN, { role: MODE_DIRECTEUR ? 'DIR' : 'RH', magasin: soc, code: code }).then(function(j){
    btn.disabled = false;
    if(j && j.ok){
      var sess = { token: j.token, role: j.role, magasin: j.magasin, expire: j.expire };
      sessionSave(currentKey(), sess);
      err.textContent = '';
      entrer(sess);
    } else if(j && j.error === 'verrouille'){
      err.style.color = '#C0392B';
      err.textContent = 'Trop d\'essais. Réessayez dans ' + (j.minutes || 15) + ' min.';
    } else {
      err.style.color = '#C0392B';
      err.textContent = 'Code incorrect.';
      document.getElementById('gatePin').value = '';
    }
  }).catch(function(){
    btn.disabled = false;
    err.style.color = '#C0392B';
    err.textContent = 'Erreur réseau — réessayez.';
  });
}

var CURRENT_SESSION = null;

function entrer(session){
  CURRENT_SESSION = session;
  LOCKED_SOCIETE = MODE_DIRECTEUR ? normSoc(session.magasin) : null;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  var lo = document.getElementById('dirLogout');
  if(lo){ lo.style.display = 'inline-block'; lo.textContent = MODE_DIRECTEUR ? 'Changer de magasin' : 'Se déconnecter'; }
  load();
  /* Rafraichissement auto : toutes les 60 min (c'etait 60 secondes — tres couteux en executions
     n8n), et seulement si l'onglet est affiche a l'ecran. Recharge immediate si l'onglet redevient
     visible apres une pause plus longue que l'intervalle. */
  var AUTOREFRESH_MS = 3600000;
  var lastAutoLoad = Date.now();
  setInterval(function(){
    if (document.visibilityState !== 'visible') return;
    load();
    lastAutoLoad = Date.now();
  }, AUTOREFRESH_MS);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && (Date.now() - lastAutoLoad) > AUTOREFRESH_MS){
      load();
      lastAutoLoad = Date.now();
    }
  });
}

function rafraichir(){ load(); }

var DATA = [];
var ARCHIVE = [];
var VIEW = 'actives';

function switchView(v){
  VIEW=v;
  document.getElementById('tabActives').classList.toggle('active',v==='actives');
  document.getElementById('tabHisto').classList.toggle('active',v==='histo');
  render();
}

function currentSet(){
  if(VIEW==='actives')return DATA.filter(function(d){return d.etape!=='termine';});
  // Historique : demandes terminées encore dans Suivi + tout l'archive, dédupliqué par id
  var termineActives=DATA.filter(function(d){return d.etape==='termine';});
  return dedupeLatest(termineActives.concat(ARCHIVE));
}

function etapeLabel(e){
  return {collab:'Collaborateur',responsable:'Responsable',direction:'Direction',directeur:'Directeur',rh:'RH',termine:'Terminé'}[e]||e;
}
function actionCell(d){
  if(d.statut!=='en_attente'||!d.lien)return '-';
  if(d.etape==='directeur'){
    // Lien de signature — pouvoir donné uniquement dans l'espace directeur (déjà protégé par code, verrouillé sur sa société)
    if(LOCKED_SOCIETE) return '<a class="btn-sign" href="'+d.lien+'" target="_blank" rel="noopener">✍️ Signer</a>';
    return '<span style="color:var(--md);font-size:11px">En attente directeur</span>';
  }
  if(d.etape==='rh'){
    // Lien de consultation (lecture seule, téléchargement PDF) — sans risque à afficher côté RH
    return '<a class="btn-view" href="'+d.lien+'" target="_blank" rel="noopener">📄 Consulter</a>';
  }
  return '-';
}
function statutBadge(s){
  if(s==='valide')return '<span class="badge b-valide">Validé ✓</span>';
  if(s==='refuse')return '<span class="badge b-refuse">Refusé</span>';
  return '<span class="badge b-attente">En attente</span>';
}
function isLate(dateStr){
  if(!dateStr)return false;
  var diff=(Date.now()-new Date(dateStr).getTime())/3600000;
  return diff>=48;
}
function fmtDate(d){
  if(!d&&d!==0)return'-';
  var dt;
  if(typeof d==='number'||/^\d+(\.\d+)?$/.test(d)){
    // Numéro de série Excel (jours depuis 1899-12-30)
    dt=new Date((Number(d)-25569)*86400000);
  }else{
    dt=new Date(d);
  }
  if(isNaN(dt))return d;
  return dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function render(){
  var fSocEl=document.getElementById('fSoc');
  var soc=fSocEl?fSocEl.value:'';
  var statut=document.getElementById('fStatut').value;
  var search=document.getElementById('fSearch').value.toLowerCase();
  var source=currentSet();

  var filtered=source.filter(function(d){
    if(LOCKED_SOCIETE){ if(normSoc(d.societe)!==LOCKED_SOCIETE) return false; }
    else if(soc&&d.societe!==soc){ return false; }
    if(statut&&d.statut!==statut)return false;
    if(search&&!((d.nom||'')+' '+(d.prenom||'')).toLowerCase().includes(search))return false;
    return true;
  });

  // Stats
  var activeOnly=DATA.filter(function(d){return d.etape!=='termine';}).filter(function(d){return !LOCKED_SOCIETE || normSoc(d.societe)===LOCKED_SOCIETE;});
  var nAttente=activeOnly.filter(function(d){return d.statut==='en_attente'}).length;
  var nRetard=activeOnly.filter(function(d){return d.statut==='en_attente'&&isLate(d.date_derniere_action)}).length;
  if(VIEW==='actives'){
    document.getElementById('stats').innerHTML=
      '<div class="stat" style="border-color:#E67E22"><div class="n">'+nAttente+'</div><div class="l">En attente signature</div></div>'+
      '<div class="stat" style="border-color:#C0392B"><div class="n">'+nRetard+'</div><div class="l">En retard (+48h)</div></div>'+
      '<div class="stat" style="border-color:#C9A84C"><div class="n">'+activeOnly.length+'</div><div class="l">Total demandes actives</div></div>';
  } else {
    var sourceScoped = LOCKED_SOCIETE ? source.filter(function(d){return normSoc(d.societe)===LOCKED_SOCIETE;}) : source;
    var archiveScoped = LOCKED_SOCIETE ? ARCHIVE.filter(function(d){return normSoc(d.societe)===LOCKED_SOCIETE;}) : ARCHIVE;
    document.getElementById('stats').innerHTML=
      '<div class="stat" style="border-color:#27AE60"><div class="n">'+sourceScoped.length+'</div><div class="l">Total historique</div></div>'+
      '<div class="stat" style="border-color:#C9A84C"><div class="n">'+archiveScoped.length+'</div><div class="l">Dont archivées</div></div>';
  }

  var tbody=document.getElementById('rows');
  if(!filtered.length){
    tbody.innerHTML='';
    document.getElementById('empty').style.display='block';
    return;
  }
  document.getElementById('empty').style.display='none';

  function isActionable(d){return LOCKED_SOCIETE&&d.etape==='directeur'&&d.statut==='en_attente'&&d.lien;}
  filtered.sort(function(a,b){
    var pa=isActionable(a)?1:0, pb=isActionable(b)?1:0;
    if(pa!==pb)return pb-pa;
    return new Date(b.date_derniere_action)-new Date(a.date_derniere_action);
  });

  tbody.innerHTML=filtered.map(function(d){
    var late=d.statut==='en_attente'&&isLate(d.date_derniere_action);
    var rowStyle=isActionable(d)?' style="background:#FFFBEA"':'';
    return '<tr'+rowStyle+'>'+
      '<td><strong>'+(d.prenom||'')+' '+(d.nom||'')+'</strong></td>'+
      '<td>'+(d.societe||'-')+'</td>'+
      '<td>'+(d.type||'-')+'</td>'+
      '<td>'+fmtDate(d.date_debut).split(' ')[0]+(d.date_fin&&d.date_fin!==d.date_debut?' → '+fmtDate(d.date_fin).split(' ')[0]:'')+'</td>'+
      '<td>'+etapeLabel(d.etape)+'</td>'+
      '<td>'+(d.en_attente_nom||'-')+'</td>'+
      '<td>'+statutBadge(d.statut)+'</td>'+
      '<td class="'+(late?'retard':'')+'">'+fmtDate(d.date_derniere_action)+(late?' ⚠️':'')+'</td>'+
      '<td>'+actionCell(d)+'</td>'+
    '</tr>';
  }).join('');
}

function dedupeLatest(arr){
  var byId={};
  arr.forEach(function(d){
    var id=d.id;
    if(!id)return;
    if(!byId[id]||new Date(d.date_derniere_action)>new Date(byId[id].date_derniere_action)){
      byId[id]=d;
    }
  });
  return Object.values(byId);
}

function load(){
  if(!CURRENT_SESSION) return;
  document.getElementById('lastUpdate').textContent='Chargement...';
  authRead(CURRENT_SESSION, 'demandes', {})
    .then(function(data){
      var raw=Array.isArray(data)?data:(data.data||[]);
      var rawArchive=Array.isArray(data)?[]:(data.archive||[]);
      DATA=dedupeLatest(raw);
      ARCHIVE=dedupeLatest(rawArchive);
      if(LOCKED_SOCIETE){
        var socSel = document.getElementById('fSoc');
        if(socSel) socSel.parentNode.removeChild(socSel);
      } else {
        var socs=[...new Set(DATA.concat(ARCHIVE).map(function(d){return d.societe;}).filter(Boolean))].sort();
        var sel=document.getElementById('fSoc');
        if(sel) sel.innerHTML='<option value="">Toutes sociétés</option>'+socs.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('');
      }
      document.getElementById('lastUpdate').textContent='Mis à jour le '+new Date().toLocaleString('fr-FR')+' ('+raw.length+' lignes, '+DATA.length+' demandes actives, '+ARCHIVE.length+' archivées)';
      render();
    })
    .catch(function(e){
      if(String(e.message)==='session'){ sessionClear(currentKey()); location.reload(); return; }
      document.getElementById('lastUpdate').textContent='Erreur de chargement — réessayez dans un instant.';
      console.error(e);
    });
}

document.getElementById('gatePin').addEventListener('keydown', function(e){ if(e.key==='Enter') tryGate(); });
initGate();
</script>
</body>
</html>
